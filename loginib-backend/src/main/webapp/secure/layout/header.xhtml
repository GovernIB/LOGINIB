<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
  	xmlns:p="http://primefaces.org/ui"
  	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<h:body>
  <ui:composition>
  	<h:form>
  		<p:panelGrid id="panelCabecera" columns="4" styleClass="panelCabecera ui-noborder w100 h100 backgroundGris"
  		columnClasses="header-color grid-left wpx200 backgroundGris,
  					   header-color wpx270,
  					   header-color opcionesFull">

			<c:choose>
			    <c:when test="#{sessionBean.hayLogo}">
			    		<p:outputPanel styleClass="h100" style="display: flex; justify-content: center; align-items: center;background-color: #f0f0f0;">
						<span class="center-vertical"></span>
			       			<h:graphicImage value="#{sessionBean.logo}" height="65" styleClass="va-middle" />
			       		</p:outputPanel>
			    </c:when>
			    <c:otherwise>
			        <p:outputPanel styleClass="h100">
						<span class="center-vertical"></span>
						<h:graphicImage value="/resources/images/null.png" height="45" styleClass="va-middle"/>
					</p:outputPanel>
			    </c:otherwise>
			</c:choose>

			<p:outputPanel styleClass="h100">
				<span class="center-vertical"></span>
				<h:outputText value="LOGINB" styleClass="titulo-color va-middle" />
			</p:outputPanel>

			<p:panelGrid columns="1" styleClass="ui-noborder botonera-menu" columnClasses="header-color" style="margin-top: 6px;">
				<p:row>
					<p:column>
	 		    		<p:menubar id="menuBar" styleClass="header-color" model="#{sessionBean.menuModel}" autoDisplay="false"/>
	 		    	</p:column>
	 		    </p:row>
    		</p:panelGrid>

		</p:panelGrid>
	</h:form>
  </ui:composition>
</h:body>
</html>
